# Corbits Triage policy.
rules:
  - check: max-files-changed
    text: Flag pull requests over 30 files changed.
    max: 30
    reason: Large pull requests are hard to review.
    evidence:
      - maintainer-stated
  - check: max-lines-changed
    text: Flag pull requests over 3,000 lines changed.
    max: 3000
    reason: Large pull requests are hard to review.
    evidence:
      - maintainer-stated
  - check: no-merge-conflicts
    text: Flag merge conflicts with the base branch.
    reason: A pull request with conflicts can't be merged as it is.
    evidence:
      - maintainer-stated
  - check: ci-green
    text: CI must pass before merge.
    reason: A change is not ready until CI passes.
    evidence:
      - maintainer-stated
  - id: conventions
    check: code-patterns
    text: Added code follows the repository's conventions.
    presets:
      - convention
    onFail: label
    reason: No invented fallbacks, nested ternaries, immediately invoked functions, promise chains, empty catches, or suppression comments.
    evidence:
      - maintainer-stated
  - id: no-process-env-in-tests
    check: code-patterns
    text: Tests do not read process.env.
    onFail: label
    reason: A test must not depend on the environment.
    evidence:
      - maintainer-stated
    patterns:
      - id: no-process-env-in-tests
        language: typescript
        message: Reads process.env in a test.
        files: ["**/*.test.ts", "**/*.test.tsx", "**/*.test.js", "**/*.test.jsx", "**/*.test.mjs", "**/*.test.cjs"]
        rule:
          pattern: process.env
      - id: no-process-env-in-tests
        language: javascript
        message: Reads process.env in a test.
        files: ["**/*.test.ts", "**/*.test.tsx", "**/*.test.js", "**/*.test.jsx", "**/*.test.mjs", "**/*.test.cjs"]
        rule:
          pattern: process.env
